<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Dashboard</title>
    <link href="/css/main.css" rel="stylesheet" />
    <script src="/js/index.js" defer></script>
  </head>

  <body>
    <header class="app-header">
      <h1>My Tasks</h1>
      <div class="header-actions">
        <button id="openAddTaskBtn" class="btn-primary">+ Add Task</button>
        <button id="logoutBtn" class="btn-secondary">Logout</button>
      </div>
    </header>

    <main class="main-content">
      <h2>Pending Tasks</h2>
      <section id="task-grid" class="task-grid"></section>

      <h2>Completed Tasks</h2>
      <section id="completed-task-grid" class="completed-task-grid"></section>
    </main>

    <dialog id="addTaskModal" class="task-modal">
      <form id="addTaskForm">
        <h2>Create New Task</h2>

        <p class="error-container">
          <span id="task-form-error" class="error-text"></span>
        </p>

        <p>
          <label for="taskTitle">Task Title:</label>
          <input
            type="text"
            id="taskTitle"
            name="title"
            required
            maxlength="60"
            placeholder="e.g. Finish Node.js API"
          />
        </p>

        <p>
          <label for="taskDesc">Short Description:</label>
          <textarea
            id="taskDesc"
            name="description"
            rows="3"
            maxlength="200"
            placeholder="e.g. Implement POST route stream handling..."
          ></textarea>
        </p>

        <div class="modal-actions">
          <button type="button" id="closeModalBtn" class="btn-secondary">Cancel</button>
          <button type="submit" class="btn-primary">Save Task</button>
        </div>
      </form>
    </dialog>

    <template id="task-card-template">
      <article class="task-card">
        <h3 class="task-title"></h3>
        <p class="task-description"></p>
        <div class="task-footer">
          <button class="btn-complete">Mark Complete</button>
          <button class="btn-delete">Remove</button>
        </div>
      </article>
    </template>
  </body>
</html>
